Options:
  Join-Permission: 'trchat.private'
  Proxy: true
  Disabled-Functions: ['Mention']
  Private: true

Bindings:
  Command: ['msg', 'message', 'tell', 'talk', 'm', 'whisper', 'w']

Sender:
  - prefix:
      sender:
        text: '&8[&e☬&8] &8[&b我 &7➦ %trchat_todisplayname%&3&8] '
    msg:
      default-color: 'f'
      special-char:
        enabled: false
        special-char-color: '&f'
      hover: '&7日期: %server_time_HH:mm:ss%'

Receiver:
  - prefix:
      receiver:
        text: '&8[&a☬&8] &8[&6%trchat_displayname% &7➥ &b我&8] '
    msg:
      default-color: 'f'
      special-char:
        enabled: false
        special-char-color: '&f'
      hover: '&7日期: %server_time_HH:mm:ss%'

# Placeholders & Conditions are available only when not proxy!
Console:
  - prefix:
      server:
        text: '&8[&6CONSOLE &7➥ &2you&8] '
    msg:
      default-color: 'f'
      special-char:
        enabled: false
        special-char-color: '&f'
