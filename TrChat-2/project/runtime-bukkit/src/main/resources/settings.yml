Options:
  Check-Update: true
  Proxy: AUTO
  Log-Normal: '[{0}] {1}: {2}'
  Log-Private: '[{0}] {1} -> {2}: {3}'
  Log-Delete-Time: 0
  Depend-Expansions: ['player', 'server']
  Prevent-Tab-Complete: false
  Component-Max-Length: 32700
  Always-Cancel-Chat-Event: false
  Cheat-Client-Secure-Chat: false
  Use-Packets: false
  Disabled-Commands: []
  Disabled-Worlds: []

Channel:
  Default: 'Normal'

Database:
  Method: SQLite
  SQL:
    host: localhost
    port: 3306
    user: root
    password: root
    database: trixey
    table: trchat_user_data

Redis:
  enabled: true
  host: localhost
  port: 6379
  user: ~
  password: ~
  connect: 32
  timeout: 1000

Chat:
  Interception:
    Anti-Repeat:
      #内容相似度防刷屏
      Similarity: 0.0
      #每个周期内（下面的Period配置项）允许发送的相似消息最大条数，0表示任何时间完全禁止连续发送相似消息
      Max-Per-Period: 0
      #计数周期
      Period: '1m'
      #是否检测周期内所有消息的相似度: true 检测周期内所有消息(更严格); false 只检测相邻两条消息
      Compare-All: false
    Anti-High-frequency:
      #每个周期内（下面的Period配置项）允许发送的消息最大条数，0表示无消息发送频率限制
      Max-Per-Period: 0
      #计数周期
      Period: '1m'
    Anti-Duplicate-Phrase:
      #句内连续重复词组允许的最大次数，超过则拦截，0表示禁用此检测
      #例如填2时，发送"加我微信加我微信"时放行, "加我微信加我微信加我微信"时拦截
      Max-Repeat: 0
      #词组白名单，其中的词组无论连续重复多少次都不拦截
      Whitelist:
        - '哈'
        - '6'
        - '?'
        - '？'
        - '!'
        - '！'
  Cooldown: '2.0s'
  Length-Limit: 100
  Permission-Check:
    Sign: false #无发言权限无法编辑告示牌 true 开启 false关闭
    Book: false #无发言权限无法编辑书与笔 true 开启 false关闭
    Anvil: false #无发言权限无法铁砧改名 true 开启 false关闭

Color:
  Chat: true
  Sign: true
  Anvil: true
  Book: true

Simple-Component:
  Hover: false
  Anvil: false
  Sign: false

MiniMessage:
  Text: false
