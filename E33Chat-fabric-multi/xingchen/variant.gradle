// An isolated source overlay; never mutate the general-purpose 26.3 target.
def xcRoot = rootProject.file('xingchen')
sourceSets.main.java.srcDir(new File(xcRoot, 'src/main/java'))
sourceSets.main.java.srcDir(new File(xcRoot, 'protocol/src/main/java'))
dependencies {
    implementation 'org.lwjgl:lwjgl-tinyfd:3.4.3'
    include 'org.lwjgl:lwjgl-tinyfd:3.4.3'
    for (String classifier : ['natives-windows', 'natives-windows-x86', 'natives-windows-arm64',
            'natives-linux', 'natives-linux-arm64', 'natives-macos', 'natives-macos-arm64']) {
        include "org.lwjgl:lwjgl-tinyfd:3.4.3:${classifier}"
    }
}
tasks.named('preprocessJava').configure {
    inputs.dir(new File(xcRoot, 'patches'))
    doLast {
        def patch = new File(xcRoot, 'patches/overlay.groovy')
        new GroovyShell(new Binding([generated: file("${buildDir}/preprocessed/main/java")])).evaluate(patch)
    }
}
tasks.named('jar') { archiveFileName = 'e33chat-Xingchen-Fabric-26.3-2.4.15+xc.1.jar' }
